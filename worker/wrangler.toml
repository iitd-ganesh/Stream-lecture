name = "secure-lecture-worker"
main = "src/index.js"
compatibility_date = "2026-09-05"
workers_dev = false

# Worker handles only the API path.
# The main website will be served separately by Cloudflare Pages.
[[routes]]
pattern = "stream-lecture.mahata.site/api/*"
zone_name = "mahata.site"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "lecture_db"
database_id = "613bd0cc-7df5-4414-ad14-7351fc828939"

# Cloudflare KV - used only for operational rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "79c26de902fd47e98e8a9bdf51840110"
